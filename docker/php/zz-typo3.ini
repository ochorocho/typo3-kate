; Production PHP settings for TYPO3 in containers

; --- Errors: never shown, always logged to stderr (picked up by the container runtime)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Hardening
expose_php = Off
allow_url_include = Off
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; --- Limits (keep memory_limit x workers below the pod memory limit!)
memory_limit = 512M
max_execution_time = 240
max_input_vars = 1500
upload_max_filesize = 64M
post_max_size = 64M

; --- OPcache: code is immutable, so never re-check timestamps
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; --- realpath cache (TYPO3 touches many files)
realpath_cache_size = 4096K
realpath_cache_ttl = 600
