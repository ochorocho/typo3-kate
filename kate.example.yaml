# Your own settings for this cluster. Copy to kate.yaml (git-ignored) and edit:
#   cp kate.example.yaml kate.yaml && chmod 600 kate.yaml
# Read by OpenTofu (infra/) and by ./kate deploy. Everything is optional:
# without kate.yaml the cluster runs on IP addresses with the cluster CA.
# Each site's domain and Let's Encrypt environment: projects/<name>/kate.yaml.

# Let's Encrypt via DNS-01 on Hetzner DNS, for every project with a domain.
# While this section exists, tofu needs the token on every run.
acme:
  email: ""                     # optional contact address
  # Hetzner Console -> project -> Security -> API tokens, Read & Write.
  # Alternatively keep it out of this file: export TF_VAR_hetzner_dns_token
  hetznerDnsToken: ""

# More public keys for "ssh ubuntu@<node>", e.g. from your laptop (the
# contents of ~/.ssh/id_ed25519.pub). The key of the machine running tofu
# (ssh_public_key_path) is always installed; this list comes on top and can
# be changed on a running cluster.
ssh:
  authorizedKeys: []
#    - ssh-ed25519 AAAA... you@laptop

# Helm values for every project (k8s/charts/typo3/values.yaml), merged over
# k8s/values/cluster.yaml. A project's own helm: (projects/<name>/kate.yaml)
# comes later and wins.
helm: {}
#  typo3:
#    mailFrom: noreply@kate.example.com
