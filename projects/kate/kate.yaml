# The kate site. See projects/_example/kate.yaml for every setting.
domain: kate.example.com

acme:
  environment: production

# The namespace from before projects/ existed: database and files live there.
namespace: typo3

# Also answers on the node IPs (https://<node-ip>/, cluster CA).
nodeIPs: true

# TYPO3 dev-main (v15) needs PHP 8.5
php: "8.5"

helm: {}
