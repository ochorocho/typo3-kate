{{- $components := list "frontend" -}}
{{- if .Values.backend.enabled }}{{- $components = append $components "backend" -}}{{- end }}
{{- range $component := $components }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "typo3.fullname" $ }}-{{ $component }}
  labels:
    {{- include "typo3.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ $.Values.service.type }}
  ports:
    - name: http
      port: {{ $.Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "typo3.selectorLabels" (dict "ctx" $ "component" $component) | nindent 4 }}
{{- end }}
