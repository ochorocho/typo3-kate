{{- if not .Values.typo3.existingSecret }}
{{- if not .Values.typo3.secret }}
{{- fail "Set typo3.existingSecret (recommended) or typo3.secret (dev only)." }}
{{- end }}
# Dev convenience only. In production, manage this Secret outside of Helm
# (External Secrets Operator, Sealed Secrets, SOPS …) and set typo3.existingSecret.
# It is a hook so it exists before the migration Job runs on first install.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "typo3.secretName" . }}
  labels:
    {{- include "typo3.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{- range $key, $value := .Values.typo3.secret }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
