{{- /* A PDB only protects against voluntary disruptions (node drains, upgrades), not node crashes. */ -}}
{{- if .Values.frontend.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "typo3.fullname" . }}-frontend
  labels:
    {{- include "typo3.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  minAvailable: {{ .Values.frontend.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "typo3.selectorLabels" (dict "ctx" . "component" "frontend") | nindent 6 }}
{{- end }}
{{- if and .Values.backend.enabled .Values.backend.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "typo3.fullname" . }}-backend
  labels:
    {{- include "typo3.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  minAvailable: {{ .Values.backend.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "typo3.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
{{- end }}
