{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "typo3.fullname" . }}
  labels:
    {{- include "typo3.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $host := .Values.ingress.hosts }}
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if $.Values.backend.enabled }}
          - path: {{ $.Values.backend.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "typo3.fullname" $ }}-backend
                port:
                  name: http
          {{- end }}
          {{- if $.Values.mercure.enabled }}
          - path: {{ $.Values.mercure.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "typo3.fullname" $ }}-mercure
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "typo3.fullname" $ }}-frontend
                port:
                  name: http
    {{- end }}
{{- end }}
