{{- if .Values.imgproxy.enabled }}
{{- $cfg := .Values.imgproxy }}
{{- $source := required "imgproxy.sourceUrl is required, e.g. https://www.example.com" $cfg.sourceUrl }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "typo3.fullname" . }}-imgproxy
  labels:
    {{- include "typo3.labels" . | nindent 4 }}
    app.kubernetes.io/component: imgproxy
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "typo3.selectorLabels" (dict "ctx" . "component" "imgproxy") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "typo3.selectorLabels" (dict "ctx" . "component" "imgproxy") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "typo3.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: imgproxy
          image: "{{ $cfg.image.repository }}:{{ $cfg.image.tag }}"
          imagePullPolicy: {{ $cfg.image.pullPolicy }}
          env:
            - name: IMGPROXY_BIND
              value: ":{{ $cfg.port }}"
            # Only originals from the site itself
            - name: IMGPROXY_ALLOWED_SOURCES
              value: {{ printf "%s/" (trimSuffix "/" $source) | quote }}
            - name: IMGPROXY_IGNORE_SSL_VERIFICATION
              value: {{ $cfg.ignoreSslVerification | quote }}
            - name: IMGPROXY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "typo3.secretName" . }}
                  key: IMGPROXY_KEY
            - name: IMGPROXY_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "typo3.secretName" . }}
                  key: IMGPROXY_SALT
            {{- range $key, $value := $cfg.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "typo3.fullname" . }}-imgproxy
  labels:
    {{- include "typo3.labels" . | nindent 4 }}
    app.kubernetes.io/component: imgproxy
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "typo3.selectorLabels" (dict "ctx" . "component" "imgproxy") | nindent 4 }}
{{- end }}
