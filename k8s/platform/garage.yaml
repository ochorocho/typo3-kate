# S3 for TYPO3's storage 2 ("Media (S3)", config/system/file-storages.yaml):
# a single-node Garage, as bmack/typo3-k8s-starter uses in DDEV.
#
# - S3 API     garage:3900  (TYPO3 only; endpoint in k8s/values/cluster.yaml)
# - web        garage:3902  (anonymous reads of the "media" bucket, routed
#                            from https://<site>/media/ by the HTTPRoute below)
#
# --single-node --default-bucket (Garage >= 2.3) sets up the layout, the bucket
# and the access key from GARAGE_DEFAULT_* on start, so no manual CLI setup.
# Secret typo3-garage is created by k8s/deploy.sh. Not replicated: the data
# lives on one local-path volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1

    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "127.0.0.1:3901"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"

    [s3_web]
    # No root_domain: the request's Host must equal the bucket name; the
    # HTTPRoute rewrites it to "media".
    bind_addr = "[::]:3902"
    index = "index.html"

    [admin]
    api_bind_addr = "[::]:3903"
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  labels:
    app.kubernetes.io/name: garage
spec:
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: s3
    - name: web
      port: 3902
      targetPort: web
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
  labels:
    app.kubernetes.io/name: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: garage
          image: dxflrs/garage:v2.6.0
          command: ["/garage", "server", "--single-node", "--default-bucket"]
          env:
            - name: GARAGE_CONFIG_FILE
              value: /etc/garage/garage.toml
            - name: GARAGE_DEFAULT_BUCKET
              value: media
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef: {name: typo3-garage, key: rpc-secret}
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: typo3-garage, key: admin-token}
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: typo3-garage, key: access-key}
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: typo3-garage, key: secret-key}
          ports:
            - name: s3
              containerPort: 3900
            - name: rpc
              containerPort: 3901
            - name: web
              containerPort: 3902
            - name: admin
              containerPort: 3903
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/garage
              readOnly: true
            - name: data
              mountPath: /var/lib/garage
      volumes:
        - name: config
          configMap:
            name: garage
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
# TYPO3 reaches Garage's S3 API through the chart's NetworkPolicy
# (networkPolicy.extraEgress in k8s/values/cluster.yaml): a separate policy
# here would cut the release's first migrations Job off from DNS.
# The route https://<site>/media/ -> Garage is per project: k8s/project-manifests.sh
