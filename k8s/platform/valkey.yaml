# From bmack/typo3-k8s-starter examples/valkey/valkey.yaml (MIT).
# typo3-kate: names typo3-*, cache 256 MB, Secret typo3-valkey created by ./kate deploy.
# Two Valkey instances with different jobs (plain manifests, no chart needed):
#
#  typo3-valkey        sessions, install tool sessions, locks
#                     -> persistent (AOF), noeviction: never drop a session silently
#  typo3-valkey-cache  TYPO3 caches (pages, hash, rootline …)
#                     -> no persistence, volatile-ttl: only entries with an expiry are evicted.
#                        TYPO3 keeps cache tags without expiry; allkeys-* policies
#                        would evict them and break flush-by-tag. Run the Scheduler
#                        task "Caching framework garbage collection" regularly.
#
# High availability: these are single instances. Losing typo3-valkey-cache costs a
# warm-up; losing typo3-valkey logs editors out. For automatic failover use a
# managed service (ElastiCache/Memorystore/…) or a Sentinel-capable chart –
# the official valkey-io chart has no Sentinel support yet.
---
apiVersion: v1
kind: Service
metadata:
  name: typo3-valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: typo3-valkey
spec:
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: typo3-valkey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: typo3-valkey
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: typo3-valkey
spec:
  serviceName: typo3-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: typo3-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: typo3-valkey
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.0
          args:
            - valkey-server
            - --requirepass
            - $(VALKEY_PASSWORD)
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
            - --databases
            - "16"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: typo3-valkey
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 320Mi
            limits:
              memory: 320Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: typo3-valkey-cache
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: typo3-valkey-cache
spec:
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
  selector:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: typo3-valkey-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: typo3-valkey-cache
  labels:
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: typo3-valkey-cache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: typo3-valkey-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: typo3-valkey-cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.0
          args:
            - valkey-server
            - --requirepass
            - $(VALKEY_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - volatile-ttl
            - --databases
            - "16"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: typo3-valkey
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: valkey
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /data
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
