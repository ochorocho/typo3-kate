services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Bmack\K8sHealth\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Check/CheckResult.php'
      - '../Classes/Check/Duration.php'
      - '../Classes/Check/Status.php'
      - '../Classes/Messenger/WorkerState.php'

  Bmack\K8sHealth\Middleware\HealthCheck:
    public: true
