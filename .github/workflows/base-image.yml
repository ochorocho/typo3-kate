# Publishes the runtime base of every site image (docker/base.Dockerfile) to
# ghcr.io/<owner>/typo3-kate-base, for linux/amd64 and linux/arm64, in two
# variants per PHP version, each with a dated tag to go back to:
#   :<php>           ImageMagick 7   (e.g. :8.5, :8.5-20261127)
#   :<php>-imgproxy  no image tools  (e.g. :8.5-imgproxy, :8.5-imgproxy-20261127)
# Each architecture builds on its own runner (arm64 natively: compiling the
# PHP extensions under emulation takes far too long), then one manifest list
# per tag joins them.
name: base-image

on:
  push:
    branches: [main]
    paths:
      - docker/base.Dockerfile
      - docker/base.Dockerfile.dockerignore
      - docker/php/**
      - .github/workflows/base-image.yml
  # Weekly, without cache: Debian and FrankenPHP security updates
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/typo3-kate-base

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        php: ["8.5", "8.4"]
        variant:
          - { tools: imagemagick, suffix: "" }
          - { tools: none, suffix: "-imgproxy" }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/base.Dockerfile
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            PHP_VERSION=${{ matrix.php }}
            IMAGE_TOOLS=${{ matrix.variant.tools }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=base-${{ matrix.php }}${{ matrix.variant.suffix }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=base-${{ matrix.php }}${{ matrix.variant.suffix }}-${{ matrix.platform.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Keep the digest for the manifest list
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          # "--" before the architecture: digest-8.5--* must not match digest-8.5-imgproxy--*
          name: digest-${{ matrix.php }}${{ matrix.variant.suffix }}--${{ matrix.platform.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        tag: ["8.5", "8.5-imgproxy", "8.4", "8.4-imgproxy"]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.tag }}--*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag ${{ matrix.tag }} for both architectures
        env:
          TAG: ${{ matrix.tag }}
        working-directory: /tmp/digests
        run: |
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          [ "${#refs[@]}" -eq 2 ] || { echo "expected 2 digests, got ${#refs[@]}" >&2; exit 1; }
          docker buildx imagetools create -t "${IMAGE}:${TAG}" -t "${IMAGE}:${TAG}-$(date -u +%Y%m%d)" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"
