# Based on the CI of bmack/typo3-k8s-starter, extended for infra/ and k8s/.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer
      - name: PHP syntax
        run: find config packages projects docker -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Composer files of every project
        run: |
          # projects/_example is only a kate.yaml template
          for file in projects/*/composer.json; do
            composer validate --no-check-publish --no-check-all "${file}"
          done
      - name: Shell scripts
        run: shellcheck -x kate infra/scripts/*.sh
      - name: gum (for ./kate)
        run: |
          version=2.0.2
          archive="gum_${version}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/charmbracelet/gum/releases/download/v${version}/${archive}"
          echo "d842e06d93dbed90af48cb8dd10698db6f22e331fc40346bb37bbc753109edc2  ${archive}" | sha256sum -c -
          tar xzf "${archive}"
          sudo install "gum_${version}_Linux_x86_64/gum" /usr/local/bin/gum
      - uses: azure/setup-helm@v4
      - name: Helm chart
        # The same values as ./kate deploy, for every project: cluster.yaml,
        # the template's cluster-wide helm:, the site's URLs and routes, then
        # the project's helm:
        run: |
          yq '.helm // {}' kate.example.yaml > cluster-helm.yaml
          for file in projects/*/kate.yaml; do
            project="$(basename "$(dirname "${file}")")"
            domain="$(yq -r '.domain // ""' "${file}")"
            args=("https://${domain:-192.0.2.1}")
            [ -z "${domain}" ] || args+=(--hostname "${domain}")
            [ "$(yq -r '.nodeIPs // false' "${file}")" = false ] || args+=(--node-ips)
            ./kate values "${args[@]}" > "site-${project}.yaml"
            yq '.helm // {}' "${file}" > "project-${project}.yaml"
            values=(-f k8s/values/cluster.yaml -f cluster-helm.yaml -f "site-${project}.yaml" -f "project-${project}.yaml"
                    --set image.repository="ci/${project}" --set image.tag=ci)
            helm lint k8s/charts/typo3 "${values[@]}"
            helm template typo3 k8s/charts/typo3 -n "${project}" "${values[@]}" > "rendered-${project}.yaml"
            routing=()
            [ -z "${domain}" ] || routing+=(--hostname "${domain}" --issuer letsencrypt-staging)
            [ "$(yq -r '.nodeIPs // false' "${file}")" = false ] || routing+=(--node-ips)
            ./kate manifests "${routing[@]}" > "rendered-${project}-routing.yaml"
          done
          # a site with imgproxy: its Deployment, Service and NetworkPolicies
          ./kate values https://img.example.com --hostname img.example.com > site-imgproxy.yaml
          helm template typo3 k8s/charts/typo3 -n img -f k8s/values/cluster.yaml -f site-imgproxy.yaml \
            --set image.repository=ci/img --set image.tag=ci --set imgproxy.enabled=true > rendered-imgproxy.yaml
          # a site under acme.wildcard: its Gateway uses the shared certificate
          ./kate manifests --hostname shop.example.com --certificate-ref gateway-system/wildcard-tls > rendered-wildcard-routing.yaml
      - name: Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          # k8s/platform/mariadb.yaml only has mariadb-operator CRDs, which kubeconform skips
          ./kubeconform -strict -summary -ignore-missing-schemas rendered-*.yaml k8s/platform/

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - name: Format
        run: tofu fmt -check -recursive -diff
      - name: Validate
        run: |
          tofu init -backend=false -input=false
          tofu validate

  image:
    # The runtime base for every PHP version, and on it the kate site's image,
    # built locally: changes to docker/base.Dockerfile are tested here before
    # .github/workflows/base-image.yml publishes them.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.5", "8.4"]
        variant:
          - { tools: imagemagick, suffix: "", imgproxy: "false" }
          - { tools: none, suffix: "-imgproxy", imgproxy: "true" }
    env:
      BASE: typo3-kate-base:${{ matrix.php }}${{ matrix.variant.suffix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the base image
        run: |
          docker build -f docker/base.Dockerfile --build-arg PHP_VERSION=${{ matrix.php }} \
            --build-arg IMAGE_TOOLS=${{ matrix.variant.tools }} -t "${BASE}" .
      - name: Base has its image tools, or none
        run: |
          has=$(docker run --rm --entrypoint sh "${BASE}" -c 'command -v convert >/dev/null && echo imagemagick || echo none')
          [ "${has}" = "${{ matrix.variant.tools }}" ] || { echo "expected ${{ matrix.variant.tools }}, found ${has}" >&2; exit 1; }
          docker run --rm --entrypoint sh "${BASE}" -c '[ "${TYPO3_KATE_IMAGE_TOOLS}" = "${{ matrix.variant.tools }}" ]'
      - name: Base has the PHP extensions TYPO3 needs
        run: |
          docker run --rm "${BASE}" php -r '
            $missing = array_diff(["intl", "gd", "mysqli", "pdo_mysql", "zip", "exif", "Zend OPcache", "redis"], get_loaded_extensions());
            if ($missing !== []) { fwrite(STDERR, "missing: " . implode(", ", $missing) . "\n"); exit(1); }
            echo "PHP ", PHP_VERSION, ": all extensions\n";
          '
      - name: The kate site uses this PHP version and variant
        id: site
        run: |
          php=$(yq -r '.php // "8.5"' projects/kate/kate.yaml)
          imgproxy=$(yq -r '.imgproxy.enabled // false' projects/kate/kate.yaml)
          echo "build=$([ "${php}" = "${{ matrix.php }}" ] && [ "${imgproxy}" = "${{ matrix.variant.imgproxy }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Build the production image
        if: steps.site.outputs.build == 'true'
        run: |
          docker build -f docker/Dockerfile --build-arg PROJECT=kate --build-arg BASE_IMAGE=typo3-kate-base \
            --build-arg PHP_VERSION=${{ matrix.php }} --build-arg BASE_VARIANT=${{ matrix.variant.suffix }} -t typo3-kate:ci .
      - name: Image answers on /_health/live
        if: steps.site.outputs.build == 'true'
        run: |
          # TYPO3 refuses to start without a key; in the cluster it comes from the Secret
          docker run -d --name typo3 -p 8080:8080 -e TYPO3_ENCRYPTION_KEY=ci-only typo3-kate:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/_health/live && exit 0
            sleep 2
          done
          docker logs typo3
          exit 1
      - name: settings.php needs no runtime writes
        if: steps.site.outputs.build == 'true'
        # docker/prepare-settings.php must leave nothing for extension:setup or
        # upgrade:run to write, and no real encryption key in the image.
        run: |
          docker run --rm --entrypoint php typo3-kate:ci -r '
            $s = require "config/system/settings.php";
            if (($s["SYS"]["encryptionKey"] ?? "") !== "set-from-env-TYPO3_ENCRYPTION_KEY") {
                fwrite(STDERR, "unexpected encryptionKey in the image\n"); exit(1);
            }
            if (empty($s["EXTENSIONS"])) {
                fwrite(STDERR, "no extension defaults in settings.php\n"); exit(1);
            }
            echo "settings.php OK: ", implode(", ", array_keys($s["EXTENSIONS"])), "\n";
          '
